---
# Secrets role - Generate all required secrets

- name: Secrets generation
  ansible.builtin.debug:
    msg: "Generating missing secrets..."

# =============================================================================
# Generate Missing Secrets
# =============================================================================

- name: Generate postgres_git_password if empty
  ansible.builtin.set_fact:
    postgres_git_password: "{{ lookup('community.general.random_string', length=48, special=false) }}"
  when: postgres_git_password | length == 0

- name: Generate postgres_n8n_password if empty
  ansible.builtin.set_fact:
    postgres_n8n_password: "{{ lookup('community.general.random_string', length=48, special=false) }}"
  when: postgres_n8n_password | length == 0

- name: Generate postgres_coolify_password if empty
  ansible.builtin.set_fact:
    postgres_coolify_password: "{{ lookup('community.general.random_string', length=48, special=false) }}"
  when: postgres_coolify_password | length == 0

- name: Generate lobe_postgres_password if empty
  ansible.builtin.set_fact:
    lobe_postgres_password: "{{ lookup('community.general.random_string', length=48, special=false) }}"
  when: lobe_postgres_password | length == 0

- name: Generate minio_root_password if empty
  ansible.builtin.set_fact:
    minio_root_password: "{{ lookup('community.general.random_string', length=32, special=false) }}"
  when: minio_root_password | length == 0

- name: Generate coolify_app_key if empty
  ansible.builtin.set_fact:
    coolify_app_key: "base64:{{ lookup('community.general.random_string', length=32, special=false) | b64encode }}"
  when: coolify_app_key | length == 0

- name: Generate key_vaults_secret if empty
  ansible.builtin.set_fact:
    key_vaults_secret: "{{ lookup('community.general.random_string', length=32, special=false) | b64encode }}"
  when: key_vaults_secret | length == 0

- name: Generate next_auth_secret if empty
  ansible.builtin.set_fact:
    next_auth_secret: "{{ lookup('community.general.random_string', length=64, special=false) }}"
  when: next_auth_secret | length == 0

- name: Generate jwks_key if empty
  ansible.builtin.set_fact:
    jwks_key: "{{ lookup('community.general.random_string', length=32, special=false) | b64encode }}"
  when: jwks_key | length == 0

- name: Generate openclaw_gateway_token if empty
  ansible.builtin.set_fact:
    openclaw_gateway_token: "{{ lookup('community.general.random_string', length=64, special=false) }}"
  when: openclaw_gateway_token | length == 0

# =============================================================================
# Template .env file
# =============================================================================

- name: Check if .env exists
  ansible.builtin.stat:
    path: "{{ paas_env_file }}"
  register: env_file_stat

- name: Backup existing .env
  ansible.builtin.copy:
    src: "{{ paas_env_file }}"
    dest: "{{ paas_env_file }}.backup.{{ ansible_date_time.epoch }}"
    remote_src: true
    mode: "0600"
  when: env_file_stat.stat.exists

- name: Generate .env file from template
  ansible.builtin.template:
    src: env.j2
    dest: "{{ paas_env_file }}"
    mode: "0600"
    backup: true

- name: Display secrets status
  ansible.builtin.debug:
    msg: |
      Secrets configured:
        - Database passwords: Generated
        - Application secrets: Generated
        - Gateway token: Generated
        - .env file: {{ paas_env_file }}
